name: Deploy to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish
      env:
        BASE_HREF: "/Lagrange-piloto/"
      run: dotnet publish Dashboard/Dashboard.csproj -c Release -o release --nologo

    - name: Validate Google Maps API key secret
      run: |
        if [ -z "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
          echo "ERROR: GOOGLE_MAPS_API_KEY secret is not set. Please define it in repository settings." >&2
          exit 1
        fi

    - name: Inject Google Maps API key
      run: |
        cat > release/wwwroot/appsettings.json <<'EOF'
        {
          "GoogleMaps": {
            "ApiKey": "${{ secrets.GOOGLE_MAPS_API_KEY }}"
          }
        }
        EOF

    - name: Add SPA fallback for GitHub Pages
      run: |
        cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./release/wwwroot
        publish_branch: gh-pages
        keep_files: false
